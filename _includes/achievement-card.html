{%- comment -%} Compact achievement card (photo, title, date). Expects `post`. {%- endcomment -%}
<a class="achievement-card" href="{{ post.url | relative_url }}">
  {%- if post.image %}
  <img class="achievement-card__img" src="{{ post.image | relative_url }}"
    alt="{{ post.image_alt | default: post.title | escape }}" loading="lazy" />
  {%- endif %}
  <div class="achievement-card__text">
    <h4 class="achievement-card__title">{{ post.title }}</h4>
    <p class="achievement-card__date">{{ post.date | date: "%B %d, %Y" }}</p>
  </div>
</a>
