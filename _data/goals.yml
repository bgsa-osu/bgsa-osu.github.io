# Goals shown under About → Goals, in this order.
- Foster social change and promote an inclusive campus environment.
- Encourage meaningful student engagement through collaboration and events.
- Strengthen cultural connection among Bangladeshi students at OSU.
- Serve as the representative body for Bangladeshi graduate students.
- Create a supportive space empowering students academically and socially.
- Build and sustain a central association connecting Bangladeshi students.
- Celebrate Bangladeshi heritage, culture, and identity at OSU.
- Promote a strong sense of community, belonging, and cultural pride.
- Advance advocacy, collaboration, and engagement for student well-being.
- Strengthen cross-cultural understanding within the Buckeye community.
