# Custom RSVP controls are keyed by permanent event ID so renaming an event
# or changing its photo cannot detach its form settings.
evt-1792786389442:
  image: /assets/jpeg/indoor_games_flyer.jpeg
  payments:
  - label: Membership paid
    value: 'Membership fee: Paid'
  - label: Event fee paid
    value: 'Entry fee: Paid'
  questions:
  - id: phone
    label: Phone No
    type: tel
    required: true
    after: identity
  - id: tournament
    label: 29 or Ludo Tournament
    previous_labels: ["29 or Ludu Tournament", "Games choice", "Choose 29 or Ludu", "Choose 29 or Ludo"]
    type: choice
    required: true
    options:
    - '29'
    - Ludo (teammates will be randomly selected)
    - Neither
  - id: teammate
    label: Preferred teammate for 29 (optional)
    type: text
    show_if:
      question_id: tournament
      equals: '29'
  - id: other-games
    label: Which other games would you like to participate in? (Select all that apply)
    previous_labels: ["Other games (select all that apply)"]
    help: Please select only the games you genuinely intend to play and ensure that you will participate if the games are organized. Some games may be organized depending on the number of interested participants.
    help_bold: true
    type: multichoice
    options:
    - Uno
    - Sequence
    - Carrom
    - Chess
