# Custom RSVP controls are keyed by permanent event ID so renaming an event
# or changing its photo cannot detach its form settings.
evt-1792786389442:
  image: /assets/jpeg/indoor_games_flyer.jpeg
  payments:
  - label: Membership paid
    value: 'Membership fee: Paid'
  - label: Event fee paid
    value: 'Entry fee: Paid'
  questions:
  - label: Phone No
    type: tel
    required: true
    after: identity
  - label: 29 or Ludu Tournament
    previous_labels: ["Games choice", "Choose 29 or Ludu"]
    type: choice
    required: true
    options:
    - '29'
    - Ludu (teammates will be randomly selected)
    - Neither
  - label: Preferred teammate for 29 (optional)
    type: text
    show_if:
      question: 29 or Ludu Tournament
      equals: '29'
  - label: Other games (select all that apply)
    type: multichoice
    options:
    - Uno
    - Sequence
    - Carrom (subject to popularity)
    - Chess (subject to popularity)
